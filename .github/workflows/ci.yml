name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -v

  go:
    name: Go provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect provider module
        id: detect
        run: |
          if [ -f provider/go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.detect.outputs.exists == 'true'
        with:
          go-version: "1.22"
          cache-dependency-path: provider/go.sum
      - name: Vet
        if: steps.detect.outputs.exists == 'true'
        working-directory: provider
        run: go vet ./...
      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: provider
        run: go test ./...

  docker:
    name: Docker compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        run: |
          docker compose -f dev/docker-compose.yml config >/dev/null
          docker compose -f dev/docker-compose.slim.yml config >/dev/null

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck dev/bootstrap.sh
